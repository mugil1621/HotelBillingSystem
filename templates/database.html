<!DOCTYPE html>
<html>

<head>

<title>Database Backup</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-dark text-white">

<h3>

💾 Database Management

</h3>

</div>

<div class="card-body">

<a href="/backup_database"
class="btn btn-success">

Create Backup

</a>

<hr>

<h4>Available Backups</h4>

<table class="table table-bordered">

<tr>

<th>File</th>

<th>Restore</th>

</tr>

{% for file in files %}

<tr>

<td>{{ file }}</td>

<td>

<form action="/restore_database"
method="POST">

<input
type="hidden"
name="filename"
value="{{ file }}">

<button class="btn btn-primary">

Restore

</button>

</form>

</td>

</tr>

{% endfor %}

</table>

<a href="/dashboard"
class="btn btn-secondary">

Dashboard

</a>

</div>

</div>

</div>

</body>

</html>

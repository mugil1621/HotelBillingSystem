<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Lunch Billing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/billing.css') }}">

</head>

<body>

<div class="container mt-3">

    <h2 class="text-center mb-4">
    🍛 Lunch Billing
</h2>
    <form action="/generate_bill" method="POST" id="billForm">

        <!-- Hidden JSON Data -->
        <input type="hidden"
               name="bill_data"
               id="bill_data">
        <input type="hidden"
                name="category"
                value="lunch">       

        <!-- Payment Mode -->
        <div class="mb-3">

            <label class="form-label">
                Payment Mode
            </label>

            <select name="payment_mode"
                    class="form-select">

                <option value="Cash">Cash</option>
                <option value="UPI">UPI</option>
                <option value="Card">Card</option>

            </select>

        </div>

        <hr>

        {% for food in foods %}

        <div class="food-row">

            <div>

                <h5>{{ food.food_name }}</h5>

                <small class="text-success">
                    ₹{{ food.price }}
                </small>

            </div>

            <div class="counter">

                <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    onclick="decrease(this)"
                    data-id="{{ food.id }}"
                    data-name="{{ food.food_name }}"
                    data-price="{{ food.price }}">

                    -

                </button>

                <input
                    type="number"
                    class="qty"
                    value="0"
                    min="0"
                    data-id="{{ food.id }}"
                    data-name="{{ food.food_name }}"
                    data-price="{{ food.price }}"
                    oninput="update()">

                <button
                    type="button"
                    class="btn btn-success btn-sm"
                    onclick="increase(this)"
                    data-id="{{ food.id }}"
                    data-name="{{ food.food_name }}"
                    data-price="{{ food.price }}">

                    +

                </button>

            </div>

        </div>

        <hr>

        {% endfor %}

        <div class="mt-4">

            <h4>

                Total Items :

                <span id="items">

                    0

                </span>

            </h4>

            <h3 class="text-primary">

                Total :

                ₹<span id="total">

                    0.00

                </span>

            </h3>

        </div>

        <button
            type="submit"
            class="btn btn-success w-100 mt-3">

            Generate Bill

        </button>

    </form>

    <a href="/dashboard"
       class="btn btn-secondary w-100 mt-2">

        Dashboard

    </a>

</div>

<script src="{{ url_for('static', filename='js/billing.js') }}"></script>

</body>

</html>

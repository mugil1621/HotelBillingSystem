<!DOCTYPE html>
<html>
<head>
    <title>Hotel Billing Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body{
            font-family:Arial;
            background:#f5f5f5;
        }

        .login-box{
            width:320px;
            margin:100px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#0d6efd;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:5px;
        }

        h2{
            text-align:center;
        }

        .error{
            color:red;
            text-align:center;
        }
    </style>

</head>

<body>

<div class="login-box">

<h2>Hotel AladiVeeran</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

</div>

</body>
</html>

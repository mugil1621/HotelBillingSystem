<!DOCTYPE html>
<html>
<head>

<title>Food Management</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

<h2 class="text-center mb-4">

Food Management

</h2>

<div class="card p-3 shadow">

<form method="POST" action="/add_food">

<div class="mb-3">

<label>Category</label>

<select
name="category"
class="form-control">

<option>Breakfast</option>

<option>Lunch</option>

<option>Dinner</option>

</select>

</div>

<div class="mb-3">

<label>Food Name</label>

<input
type="text"
name="food_name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Price</label>

<input
type="number"
name="price"
class="form-control"
required>

</div>

<button class="btn btn-success w-100">

Add Food

</button>

</form>

</div>

<br>

<table class="table table-bordered table-striped">

<tr>

<th>ID</th>

<th>Category</th>

<th>Food</th>

<th>Price</th>

<th>Action</th>

</tr>

{% for food in foods %}

<tr>

<td>{{food.id}}</td>

<td>{{food.category}}</td>

<td>{{food.food_name}}</td>

<td>₹ {{food.price}}</td>

<td>

<a
href="/delete_food/{{food.id}}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

{% endfor %}

</table>

<a href="/dashboard" class="btn btn-primary">

Dashboard

</a>

</div>

</body>

</html>
